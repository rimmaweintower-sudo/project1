<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="swiper-bundle.min.css">
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <header>
      <h1 class="header__title">ремонт техники различных брендов</h1>
    </header>
    <div class="swiper">
      <ul class="swiper-wrapper">
        <li class="swiper-slide">
            <img src="logos/lenovo.svg" alt="">
            <span class="swiper-slide__arrow"></span>
        </li>
        <li class="swiper-slide">
            <img src="logos/samsung.svg" alt="">
            <span class="swiper-slide__arrow"></span>
        </li>
        <li class="swiper-slide">
            <img class="cursed" src="logos/apple.svg" alt="">
            <span class="swiper-slide__arrow"></span>
        </li>
        <li class="swiper-slide">
            <img src="logos/vs.svg" alt="">
            <span class="swiper-slide__arrow"></span>
        </li>
        <li class="swiper-slide">
            <img src="logos/bosch.svg" alt="">
            <span class="swiper-slide__arrow"></span>
        </li>
        <li class="swiper-slide">
            <img class="cursed" src="logos/hp.svg" alt="">
            <span class="swiper-slide__arrow"></span>
        </li>
        <li class="swiper-slide swiper-slide--hidden">
            <img src="logos/acer.svg" alt="">
            <span class="swiper-slide__arrow"></span>
        </li>
        <li class="swiper-slide swiper-slide--hidden">
            <img src="logos/sony.svg" alt="">
            <span class="swiper-slide__arrow"></span>
        </li>
        <li class="swiper-slide swiper-slide--hidden">
            <img src="logos/lenovo.svg" alt="">
            <span class="swiper-slide__arrow"></span>
        </li>   
        <li class="swiper-slide swiper-slide--hidden">
            <img class="cursed" src="logos/apple.svg" alt="">
            <span class="swiper-slide__arrow"></span>
        </li>
        <li class="swiper-slide swiper-slide--hidden">
            <img src="logos/vs.svg" alt="">
            <span class="swiper-slide__arrow"></span>
        </li>
      </ul>
      <div class="swiper-pagination"></div>
    </div>
    <button class="expand-button">
        <img class="expand-button__icon" src="images/expand.svg">
       <span class="expand-button__text">Показать все</span>
    </button>
     <script src="swiper-bundle.min.js"></script>
    
    <script src="script3.js"></script>
</body>
</html>
